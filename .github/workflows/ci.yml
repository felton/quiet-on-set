name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  fresh-copy:
    # Builds the template the way `npx degit` delivers it: tracked files only,
    # no .git directory. Catches anything that only works because of local
    # state, git hooks, or files that were never committed.
    name: Fresh copy builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Export tracked files without .git
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/app"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install, check and build
        working-directory: ${{ runner.temp }}/app
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build
